<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Orquesta — Tu equipo de agentes. Tu forma de trabajar.</title>
  <desc id="desc">Identidad de Orquesta y ejemplo de equipo: Astra dirige, tres agentes Opus implementan y devuelven sus consultas al director.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#353e50"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151b28"/><stop offset="1" stop-color="#101216"/></linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#6d829f" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#bg)"/>
  <rect x="636" y="1" width="544" height="438" fill="url(#grid)" opacity=".55"/>
  <path d="M630 42V398" stroke="#2a3342"/>
  <g transform="translate(56 48)">
    <rect width="56" height="56" rx="16" fill="#222c43"/>
    <circle cx="28" cy="28" r="16" fill="none" stroke="#a7beff" stroke-width="5"/>
    <circle cx="28" cy="28" r="4" fill="#a7beff"/>
    <circle cx="42" cy="37" r="6" fill="#88d2b1" stroke="#151b28" stroke-width="3"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="128" y="91" fill="#f4f6fa" font-size="48" font-weight="650" letter-spacing="-2">orquesta</text>
    <text x="57" y="177" fill="#f4f6fa" font-size="37" font-weight="600" letter-spacing="-1">Tu equipo de agentes.</text>
    <text x="57" y="225" fill="#a7beff" font-size="37" font-weight="600" letter-spacing="-1">Tu forma de trabajar.</text>
    <text x="58" y="270" fill="#aab6c9" font-size="19">Elegí los modelos. Guardá tu combo.</text>
    <text x="58" y="298" fill="#aab6c9" font-size="19">Seguí cada consulta, cambio y prueba.</text>
    <rect x="56" y="350" width="142" height="38" rx="19" fill="#222c43" stroke="#384a71"/>
    <text x="127" y="375" text-anchor="middle" fill="#c6d5ff" font-size="15" font-weight="600">CODEX</text>
    <rect x="210" y="350" width="164" height="38" rx="19" fill="#262322" stroke="#4b4136"/>
    <text x="292" y="375" text-anchor="middle" fill="#edcda4" font-size="15" font-weight="600">CLAUDE CODE</text>
    <text x="400" y="375" fill="#9ca9bb" font-size="15">+ panel local</text>
    <text x="912" y="63" text-anchor="middle" fill="#9ca9bb" font-size="13" letter-spacing="2">UN EJEMPLO DE EQUIPO</text>
    <path d="M912 206V235H742V271M912 235V271M912 235H1082V271" fill="none" stroke="#6d829f" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1150 306H1165V157H1036" fill="none" stroke="#7fa995" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
    <rect x="788" y="109" width="248" height="98" rx="14" fill="#222c43" stroke="#718aca"/>
    <circle cx="815" cy="136" r="4" fill="#a7beff"/>
    <text x="829" y="141" fill="#bccdf7" font-size="13" letter-spacing="1.2">DIRECTOR</text>
    <text x="813" y="178" fill="#f1f5ff" font-size="29" font-weight="600">Astra</text>
    <text x="1012" y="177" text-anchor="end" fill="#bcc9e1" font-size="15">Plan + QA</text>
    <g fill="#211f20" stroke="#685742">
      <rect x="674" y="273" width="136" height="82" rx="12"/>
      <rect x="844" y="273" width="136" height="82" rx="12"/>
      <rect x="1014" y="273" width="136" height="82" rx="12"/>
    </g>
    <g fill="#efbd7b" font-size="25" font-weight="600" text-anchor="middle">
      <text x="742" y="307">Opus</text><text x="912" y="307">Opus</text><text x="1082" y="307">Opus</text>
    </g>
    <g fill="#c7b39a" font-size="13" text-anchor="middle">
      <text x="742" y="333">Implementador 1</text><text x="912" y="333">Implementador 2</text><text x="1082" y="333">Implementador 3</text>
    </g>
    <circle cx="741" cy="393" r="4" fill="#88d2b1"/>
    <text x="756" y="398" fill="#a9c9b9" font-size="15">Las dudas vuelven al director</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="20" fill="none" stroke="#30394a"/>
</svg>
